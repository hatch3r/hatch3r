name: Bug report
description: Report a bug to help us improve
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. Required fields must be completed before the issue can be submitted — this keeps reports diagnosable without a follow-up round-trip.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reproduce the behavior.
      placeholder: |
        1. Run `npx hatch3r ...`
        2. ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 14, Ubuntu 22.04, Windows 11
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version` (minimum supported is 22.0.0).
      placeholder: 22.0.0
    validations:
      required: true
  - type: input
    id: hatch3r-version
    attributes:
      label: hatch3r version
      description: Output of `hatch3r --version` (or `npx hatch3r --version`).
      placeholder: 2.5.0
    validations:
      required: true
  - type: dropdown
    id: tools
    attributes:
      label: Tools configured
      description: Which agentic coding tools did you generate a setup for? Select all that apply.
      multiple: true
      options:
        - Claude Code
        - Cursor
        - GitHub Copilot
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here (logs, screenshots, related issues).
    validations:
      required: false
