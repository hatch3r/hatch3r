name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Cycle 12 M D4-SA4.4-02 (D4): least-privilege default at workflow scope. The
# gates job below inherits contents: read (checkout only); the publish job
# elevates to contents: write + id-token: write + attestations: write. Holding
# id-token off the workflow scope keeps the npm trusted-publishing OIDC token
# out of any job that runs third-party build code (tsup/eslint/tsc/vitest/
# cyclonedx) — mirrors the deploy-docs.yml F4.3.6 per-job narrowing for Pages.
permissions:
  contents: read

jobs:
  # ── Job 1: gates + pack (NO id-token, NO publish credential) ──────────────
  # Cycle 12 M D4-SA4.4-02 (D4): all third-party build code runs here on the
  # exact shipping commit — Cycle-10 F4.3.8's gates-on-the-shipping-commit
  # strength is preserved — but this job holds no OIDC token, so a compromised
  # gate-step dependency cannot mint a trusted-publishing credential. It hands
  # the packed tarball + SBOM to the publish job via an artifact verified
  # against the gates job's tarball_sha job output (PRR-DEFER-1 trust path).
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate_version.outputs.version }}
      # PRR-DEFER-1: the packed tarball's SHA-256 rides the job-outputs channel
      # so the publish job verifies its download against a value that never
      # traveled inside the artifact under verification — the previous
      # in-artifact .sha256 file made that check circular (the artifact
      # attested itself).
      tarball_sha: ${{ steps.pack.outputs.tarball_sha }}

    steps:
      # Cycle 10 H F4.3.2 + Cycle 11 H D4-5 (D4): step-security/harden-runner as
      # the first step with egress-policy: block. This job executes third-party
      # devDependency binaries (tsup, eslint, tsc, tsx validators, vitest, npx
      # cyclonedx) on the shipping commit, so it fails closed on any unlisted
      # destination. Pinned to the v2.19.3 commit SHA (2026-05-14) per the
      # repo-wide actions-pinning policy. disable-sudo: true removes the
      # runner's privilege-escalation path.
      #
      # Cycle 12 M D4-SA4.4-02 (D4): this job holds NO id-token and NO publish
      # credential (the OIDC token lives only on the publish job below), so its
      # allowlist drops the token.actions, sigstore, and uploads.github.com
      # hosts the single pre-split job carried — none are reachable from here.
      #
      # Allowlist (least privilege for this job; each entry maps to a step's
      # egress, a missing entry fails the job closed):
      #   api.github.com, github.com        — Checkout + `git fetch origin main`
      #                                       + setup-node version manifest
      #   nodejs.org                        — actions/setup-node Node 22 download
      #   objects.githubusercontent.com     — GitHub object/manifest CDN
      #   registry.npmjs.org                — npm ci / npx cyclonedx / npm audit
      #   results-receiver.actions.githubusercontent.com,
      #   *.blob.core.windows.net           — actions/upload-artifact (v7)
      #                                       hand-off to the publish job (Actions
      #                                       results service + Azure blob artifact
      #                                       storage). New with the D4-SA4.4-02
      #                                       split — verify against the
      #                                       harden-runner audit baseline
      #                                       (Insights → Recommended Policy) on
      #                                       the first release run and pin the
      #                                       observed blob subdomain if the
      #                                       wildcard proves broader than needed.
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            results-receiver.actions.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Cycle 10 M D4-M4 (D4): full history needed so the next step can run
          # `git merge-base --is-ancestor <tag-sha> origin/main` — the default
          # shallow checkout (depth 1) has no main ref and the ancestry probe
          # cannot resolve.
          fetch-depth: 0

      # Cycle 10 M D4-M4 (D4): a `v*` tag pushed from any branch triggers this
      # workflow. "Validate version" below asserts the tag string matches
      # package.json, but nothing in the workflow prevents a tag placed on an
      # unreviewed side branch from reaching the gates. `git merge-base
      # --is-ancestor` is non-zero unless the tagged commit is reachable from
      # `origin/main`, so this step blocks a tag whose commit never landed on
      # main.
      #
      # Cycle 12 M D4-SA4.4-01 (D4) — honesty boundary: this guard REDUCES but
      # does not by itself CLOSE the write-access rogue-tag channel. A
      # tag-triggered run executes the release.yml present AT THE TAGGED COMMIT,
      # so a write-access attacker who tags a branch carrying a release.yml with
      # this step deleted is not stopped by it — the guard lives inside the
      # artifact it guards. The durable, platform-side closures are (1) an
      # `npm-publish` environment required-reviewer + a `v*` deployment tag
      # policy and a `v*` tag ruleset (GitHub repo settings, not expressible in
      # this file — tracked in D4-SA4.4-01), and (2) the gates/publish job split
      # in this workflow (D4-SA4.4-02) that keeps the npm OIDC token out of any
      # job running third-party build code. Mirrors the D4-14 SBOM
      # floor-honesty precedent — name the residual path, do not overclaim.
      - name: Verify tag commit is on main
        run: |
          TAG_SHA=$(git rev-list -n 1 "$GITHUB_REF")
          echo "Tag $GITHUB_REF -> commit $TAG_SHA"
          # actions/checkout with fetch-depth: 0 fetches all branches and
          # tags but does NOT create a local tracking branch for `main` unless
          # explicitly asked. Resolve via the remote ref directly.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$TAG_SHA" FETCH_HEAD; then
            echo "::error::Tagged commit $TAG_SHA is not an ancestor of origin/main. Refusing to publish."
            exit 1
          fi
          echo "Tag ancestry verified: $TAG_SHA reachable from origin/main"

      # Cycle 12 L D4-SA4.3-10 (D4): cache deliberately omitted. Every other
      # npm-installing job in this repo declares `cache: npm`, but the release
      # path must not restore cross-branch-writable Actions cache content into
      # the environment that runs `npm ci`, builds, and packs the shipped
      # tarball — GitHub Actions caches are writable from any branch, a
      # documented poisoning path into release artifacts (Adnan Khan,
      # adnanthekhan.com/2024/05/06 GitHub Actions cache-poisoning writeup,
      # accessed 2026-07-10). Do NOT add `cache: npm` here for the ~20s install
      # saving; the isolation from restored cache content is the point.
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Cycle 12 M D4-SA4.4-02 (D4): the validated tag version is exported as a
      # job output so the publish job — which does not check out the repo and so
      # has no package.json — can name the exact published version for the
      # `npm audit signatures` provenance re-check.
      - name: Validate version
        id: validate_version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version validated: $TAG_VERSION"

      # Cycle 11 H D4-3 (D4): extract the CHANGELOG section for this tag BEFORE
      # any irreversible step (npm pack/publish). `npm publish` is immutable —
      # npm blocks unpublish after 72h — so a missing or misnamed
      # `## [<version>]` header that previously aborted only at the post-publish
      # release-notes step left npm published while the GitHub Release was never
      # created, desyncing the two. Failing closed here (alongside Validate
      # version, and now entirely inside the gates job that gates publish) keeps
      # the precondition ahead of the irreversible boundary; release-notes.md
      # rides the artifact to the publish job's Create GitHub Release step.
      - name: Extract CHANGELOG section for release notes
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v ver="$TAG_VERSION" '
            $0 ~ "^## \\["ver"\\]" { capture=1; print; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG entry found for v$TAG_VERSION (expected header: ## [$TAG_VERSION])"
            exit 1
          fi
          echo "Release notes ($(wc -l < release-notes.md) lines):"
          head -5 release-notes.md

      # Cycle 10 M D4-M2 (D4): NPM_CONFIG_IGNORE_SCRIPTS=true takes precedence
      # over .npmrc (npm 11 config order: cli > env > project rc > user rc >
      # global rc). The gates job runs the highest-value third-party code in the
      # release path, so the lifecycle-script deny is enforced via env on every
      # `npm ci`, not only via .npmrc which a malicious transitive Git-dep can
      # rewrite mid-install with an `installconfig` key.
      #
      # Cycle 11 M D4-13 (D4): this env is scoped to install steps only, but
      # `prepublishOnly` (package.json) is INTENTIONALLY INERT in this pipeline
      # regardless of this env, on both axes: (1) .npmrc carries
      # `ignore-scripts=true` repo-wide, so even the unscoped `npm pack` below
      # runs no `prepack`/`prepublishOnly`; (2) the publish job ships the
      # pre-packed `$TARBALL` file (`npm publish "$TARBALL"`), and publishing a
      # tarball file never runs `prepublishOnly`. The explicit Build step below
      # is the real dist/ guarantee for this CI path. `prepublishOnly` is kept
      # in package.json solely as the dist-rebuild safety net for a local
      # emergency `npm publish` (no tarball arg, no .npmrc ignore-scripts) — see
      # the publish job's Publish step provenance comment.
      - name: Install dependencies
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: npm ci

      # npm ci already validates that package-lock.json is in sync with
      # package.json and will exit non-zero if they diverge. This explicit
      # step catches any uncommitted lockfile drift that survived locally.
      - name: Verify lockfile sync
        run: git diff --exit-code package-lock.json

      # Cycle 10 L F4.3.9 (D4): `time` captures the tsup build duration in the
      # ubuntu-only release log — the baseline for the build-output caching
      # decision (add actions/cache only if >60s; see ci.yml Build rationale).
      - name: Build
        run: time npm run build

      # Cycle 10 L F4.3.8 (D4): run lint + typecheck here, not only in ci.yml.
      # ci.yml gates push-to-main and pull_request-to-main; a `v*` tag pushed
      # to an older main commit that has since drifted (or any out-of-band tag
      # push) would otherwise publish without a fresh lint/typecheck pass. All
      # five gates (lint, typecheck, build, test, audit) run on the exact
      # commit that ships — <2 min added runtime, defense in depth.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Cycle 11 H D2-1 (D2): the strict canonical-read release gate
      # (scripts/validate-canonical.ts) and the rest of the `npm run validate`
      # chain (see package.json's `validate` script — the gate enumeration
      # auto-drifts as gates are added, so it is not duplicated here) gate
      # push/PR-to-main in ci.yml's D16-1 umbrella step, but
      # a `v*` tag pushed to an older or out-of-band main commit would otherwise
      # reach `npm publish` WITHOUT re-running them on the exact shipping commit.
      # validate-canonical throws on any canonical-read warning (degraded YAML,
      # PERMISSION_DENIED, TYPE_MISMATCH, promptGuard injection token), so a
      # tarball that silently lost canonical files cannot pass this step. Placed
      # before the irreversible Pack boundary, mirroring the Lint/Typecheck/Test
      # defense-in-depth steps above. The whole chain runs offline via tsx against
      # source + the bundled content root (no network host), so it is compatible
      # with the egress-policy: block allowlist — no allowed-endpoint entry added.
      - name: Content + governance validation gates
        run: npm run validate

      - name: Test
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=moderate --omit=dev

      # Pack the exact tarball that will be published so the SBOM attestation
      # subject digest matches the artifact npm receives (the publish job ships
      # this same file). --pack-destination keeps it at the workspace root for
      # the SBOM subject and the artifact upload.
      #
      # Cycle 12 M D4-SA4.4-02 (D4): record a SHA-256 of the packed tarball so
      # the publish job can verify byte-for-byte that it publishes exactly what
      # the gates ran against, across the artifact hand-off boundary.
      #
      # PRR-DEFER-1: the digest the publish job trusts is the tarball_sha job
      # output emitted below — a channel separate from the artifact it
      # verifies. The $TARBALL.sha256 file still rides the artifact as an
      # informational copy for out-of-band checks, but it is no longer the
      # verification anchor: a digest packed inside the artifact it attests is
      # circular.
      - name: Pack tarball
        id: pack
        run: |
          npm pack --pack-destination .
          TARBALL=$(ls -1 *.tgz | head -1)
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          echo "tarball_sha=$(awk '{print $1}' "$TARBALL.sha256")" >> "$GITHUB_OUTPUT"
          echo "Packed: $TARBALL ($(wc -c < "$TARBALL") bytes)"
          echo "Digest: $(cat "$TARBALL.sha256")"

      # Cycle 10 H F4.3.1+F4.4.3 (D4): emit a CycloneDX SBOM of the package
      # that is about to be published so end users can verify the component
      # inventory of the hatch3r tarball — a hard item in the CONSTITUTION
      # §2 P5 + §CQ3 100% supply-chain floor (npm provenance + SBOM + SHA-
      # pinned actions + cosign). @cyclonedx/cyclonedx-npm walks the installed
      # dependency tree (npm ci ran above) and writes CycloneDX 1.6 JSON.
      # --omit dev keeps the SBOM scoped to what actually ships in the
      # published package (the same scope as `npm publish`). Generated in the
      # gates job because `npx cyclonedx` is third-party code — the publish job
      # attests this SBOM but never runs the generator.
      #
      # Cycle 11 M D4-14 (D4): floor honesty — this generation step (SBOM
      # produced + uploaded to the Release) is the hard-floor guarantee; npm
      # provenance at the Publish step is also blocking. The downstream Sigstore
      # *attestation* of this SBOM is best-effort (continue-on-error, with a
      # `::warning::` + job-summary flag on drop) because it depends on Sigstore
      # availability at release time. So "100% supply-chain floor" means SBOM is
      # always produced + published and provenance is always signed; SBOM
      # attestation is signed when Sigstore is reachable and loudly flagged when
      # it is not — it never silently downgrades to green.
      - name: Generate SBOM (CycloneDX)
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@4.2.1 \
            --omit dev \
            --spec-version 1.6 \
            --output-format JSON \
            --output-file sbom.cdx.json
          echo "SBOM generated: $(wc -c < sbom.cdx.json) bytes"

      # Cycle 12 M D4-SA4.4-02 (D4): hand the packed tarball, its SHA-256, the
      # CycloneDX SBOM, and the validated release notes to the publish job. This
      # is the split's privilege boundary — nothing token-capable ran to produce
      # these artifacts, and the publish job verifies the tarball digest against
      # the gates job's tarball_sha output (PRR-DEFER-1) before it publishes.
      # retention-days: 1 because the artifact only needs to
      # survive the gates -> publish hand-off inside this one run.
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: |
            *.tgz
            *.tgz.sha256
            sbom.cdx.json
            release-notes.md
          if-no-files-found: error
          retention-days: 1

  # ── Job 2: publish (id-token + attestations + Release write; minimal steps) ─
  # Cycle 12 M D4-SA4.4-02 (D4): the ONLY job holding the npm trusted-publishing
  # OIDC token. It runs no build/test/lint/SBOM code — only npm (publish /
  # install / audit-signatures) and pinned first-party actions against the
  # digest-verified tarball the gates job packed. `needs: gates` makes every
  # gate (including the tag-ancestry probe) a precondition of publish, and
  # `environment: npm-publish` is the single approval point once its
  # protection rules are configured per D4-SA4.4-01.
  publish:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    # Cycle 12 M D4-SA4.4-02 (D4): the npm OIDC + attestation + Release-write
    # grants live only here, not at workflow scope.
    # attestations: write lets actions/attest-sbom record a signed SBOM
    # attestation through the same Sigstore/OIDC path that backs npm provenance
    # (id-token: write), tying the component inventory to the published tarball
    # (Cycle 10 H F4.3.1+F4.4.3 — CONSTITUTION §2 P5 + §CQ3 supply-chain floor:
    # npm provenance + SBOM + SHA-pinned actions). contents: write is required
    # by softprops/action-gh-release to create the GitHub Release.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      # Cycle 10 H F4.3.2 + Cycle 11 H D4-5 (D4): harden-runner egress-policy:
      # block on the publish job too — it holds id-token: write, the
      # highest-value credential in the repo. Pinned to the v2.19.3 commit SHA;
      # disable-sudo: true.
      #
      # Cycle 12 M D4-SA4.4-02 (D4): allowlist is the publish-capability subset
      # plus the artifact-download endpoints — the gates job already ran all
      # third-party build code, so nothing here can convert a devDependency
      # compromise into an OIDC mint.
      #
      # Allowlist (each entry maps to a step's egress; a missing entry fails the
      # publish closed):
      #   api.github.com, github.com        — setup-node manifest + attest-sbom
      #                                       + action-gh-release
      #   nodejs.org                        — actions/setup-node Node 22 download
      #   objects.githubusercontent.com     — GitHub object/manifest CDN
      #   registry.npmjs.org                — npm publish / install / audit
      #                                       signatures / global npm upgrade
      #   token.actions.githubusercontent.com — GitHub OIDC token (id-token)
      #   fulcio.sigstore.dev, rekor.sigstore.dev, tuf-repo-cdn.sigstore.dev
      #                                       — npm provenance + SBOM attestation
      #   uploads.github.com                — GitHub Release asset upload (SBOM)
      #   results-receiver.actions.githubusercontent.com,
      #   *.blob.core.windows.net           — actions/download-artifact (v8) of
      #                                       the packed tarball + SBOM from the
      #                                       gates job. New with the D4-SA4.4-02
      #                                       split — verify against the
      #                                       harden-runner audit baseline on the
      #                                       first release run.
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            *.blob.core.windows.net:443
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            results-receiver.actions.githubusercontent.com:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443

      # Cycle 12 L D4-SA4.3-10 (D4): cache deliberately omitted — same
      # cross-branch-writable cache-poisoning rationale as the gates job's
      # setup-node above, and this job additionally holds the npm trusted-
      # publishing OIDC token. Do NOT add `cache: npm` here.
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        # Cycle 12 L D4-SA4.4-04 (D4): pinned to 11.18.0 — head of the npm 11.x
        # line (`npm view npm@11 version`, 2026-07-12), >= the 11.15.0 staged-
        # publishing floor, kept on major 11 (no npm 12 compatibility pass) for
        # publish-path conservatism. Re-check vs `npm view npm@11 version` each D4
        # cycle: this run-line pin has no dependabot / expected-versions owner
        # (that lattice sees package.json deps + `uses:` digests, not `run:`
        # installs), so its currency lives in this comment.
        run: npm install -g npm@11.18.0

      # Cycle 12 M D4-SA4.4-02 (D4): download the gates job's packed tarball,
      # SBOM, digest, and release notes. No repo checkout runs in this job —
      # npm provenance is generated from the GitHub Actions OIDC context and env
      # (GITHUB_REPOSITORY/SHA/WORKFLOW_REF), not from a local .git tree, so the
      # publish stays isolated from the source tree the gates ran against.
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist

      # Cycle 12 M D4-SA4.4-02 (D4): verify the tarball is byte-for-byte the one
      # the gates ran against before the irreversible npm publish.
      #
      # PRR-DEFER-1: the expected digest comes from the gates job's tarball_sha
      # output (needs.gates.outputs), NOT from the .sha256 file inside the
      # downloaded artifact — a digest read from the same artifact it verifies
      # is circular (the artifact attests itself). The comparison fails the
      # release closed on any mismatch and on an empty/missing output. Export
      # the verified tarball name for the Publish + Attest steps below.
      - name: Verify tarball digest
        env:
          EXPECTED_SHA: ${{ needs.gates.outputs.tarball_sha }}
        run: |
          TARBALL=$(ls -1 *.tgz | head -1)
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          ACTUAL_SHA=$(sha256sum "$TARBALL" | awk '{print $1}')
          if [ -z "$EXPECTED_SHA" ] || [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Tarball digest mismatch: gates job output '$EXPECTED_SHA' vs downloaded artifact '$ACTUAL_SHA'. Refusing to publish."
            exit 1
          fi
          echo "Digest verified against gates job output: $TARBALL ($ACTUAL_SHA)"

      # Cycle 10 L F4.4.2 (D4): provenance is generated by npm trusted
      # publishing (OIDC) — the `environment: npm-publish` + `id-token: write`
      # + npm@11.18.0 path on this job is the source of truth, GA since
      # 2025-07-31 (GitHub Changelog). The explicit `--provenance` flag is a
      # belt-and-suspenders fallback in case the trust config is rebuilt locally
      # for an emergency publish; it does NOT enforce OIDC use, so the trust
      # config remains the attestation mechanism of record.
      - name: Publish to npm (with provenance)
        run: npm publish "$TARBALL" --access public --provenance

      # Cycle 10 L F4.4.5 (D4): re-fetch the version just published and run
      # `npm audit signatures` against it so a "published but provenance not
      # registered in Rekor" edge case surfaces in the release log rather than
      # only when an end user later verifies. npm rejects explicit provenance
      # failures inline at publish; this catches the succeeded-but-no-record
      # case. Non-blocking (continue-on-error) — the publish already succeeded
      # and registry/Rekor indexing can lag a few seconds, so a transient
      # verification miss must not fail an otherwise-clean release; the step
      # output is the signal. Runs in a throwaway dir so it audits the
      # published artifact, not the local workspace tree. PKG_VERSION comes from
      # the gates job output (this job has no checked-out package.json).
      - name: Verify published provenance (npm audit signatures)
        continue-on-error: true
        env:
          PKG_VERSION: ${{ needs.gates.outputs.version }}
        run: |
          VERIFY_DIR="$(mktemp -d)"
          cd "$VERIFY_DIR"
          npm init -y >/dev/null 2>&1
          # Install the exact version just published, scripts disabled, then
          # verify its registry signatures + provenance attestation.
          npm install --ignore-scripts --no-audit --no-fund "hatch3r@$PKG_VERSION"
          npm audit signatures

      # Attest the SBOM through the same Sigstore/OIDC path that backs npm
      # provenance, binding the signed component inventory to the exact
      # published tarball (packed in the gates job, digest-verified above,
      # published as-is). Runs after publish so a release is not blocked on a
      # transient Sigstore outage during attestation; the attestation is
      # recorded against the immutable packed artifact regardless.
      #
      # Cycle 11 M D4-14 (D4): kept non-blocking (continue-on-error) for
      # Sigstore availability, but the failure is no longer silent. The
      # follow-up step below fires only when `steps.attest_sbom.outcome` is
      # `failure` (continue-on-error preserves the true outcome while flipping
      # the step conclusion to success), emitting a `::warning::` annotation and
      # a job-summary flag so a green release whose SBOM attestation was dropped
      # is visible on the run page rather than passing unremarked. Honesty
      # boundary: npm provenance at the Publish step IS blocking (hard floor);
      # SBOM attestation is best-effort under Sigstore availability — see the
      # Generate SBOM step comment for the reconciled floor wording.
      - name: Attest SBOM
        id: attest_sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ env.TARBALL }}
          sbom-path: sbom.cdx.json
        continue-on-error: true

      # Cycle 11 M D4-14 (D4): surface a dropped SBOM attestation on the run.
      # `continue-on-error: true` on the step above sets its `conclusion` to
      # success (so the job stays green for Sigstore availability) but leaves
      # `outcome` at the real `failure`, so this guard is forgery-resistant: it
      # cannot fire on a genuine attestation success. The `::warning::` shows on
      # the run page and the GITHUB_STEP_SUMMARY line flags the gap in the job
      # summary; the unsigned sbom.cdx.json still uploads to the Release below so
      # the component inventory is available, just unattested this run.
      - name: Flag dropped SBOM attestation
        if: steps.attest_sbom.outcome == 'failure'
        run: |
          echo "::warning title=SBOM attestation dropped::actions/attest-sbom failed (likely transient Sigstore availability). The Release SBOM uploaded below is UNATTESTED for this version. Re-run the workflow or attest sbom.cdx.json out-of-band to restore the supply-chain attestation."
          {
            echo "### ⚠ SBOM attestation dropped"
            echo ""
            echo "The \`Attest SBOM\` step failed (continue-on-error kept the release green)."
            echo "\`sbom.cdx.json\` is attached to the Release but is **unattested** for this version."
            echo "npm provenance (blocking) succeeded; only the best-effort SBOM attestation was dropped."
          } >> "$GITHUB_STEP_SUMMARY"

      # Attach the CycloneDX SBOM to the GitHub Release so consumers can fetch
      # the component inventory of this exact version without re-running the
      # workflow (F4.3.1+F4.4.3 recommendation step 2 — SBOM as a release
      # artifact). The tarball is attested above; the SBOM rides alongside it.
      #
      # release-notes.md was extracted and validated in the gates job (Cycle 11
      # H D4-3), BEFORE the irreversible npm publish, and rides the artifact to
      # this step. The release-prep skill (Step 6) writes a Keep-a-Changelog
      # section per release; this body_path consumes that single source so
      # CHANGELOG.md and the GitHub release page cannot diverge (no GitHub
      # auto-generation).
      #
      # Cycle 10 L F4.4.6 (D4): release-notes.md lives in the runner workspace.
      # No cleanup is needed because both jobs target GitHub-hosted runners only
      # (`runs-on: ubuntu-latest`), whose workspace is ephemeral and discarded
      # after the job — a stale release-notes.md from a prior run cannot survive.
      # If this workflow ever moves to a self-hosted runner, add an
      # `rm -f release-notes.md` cleanup (or switch action-gh-release to a
      # `body:` step output) before relying on it, because self-hosted
      # workspaces persist between runs.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          body_path: release-notes.md
          files: sbom.cdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
