name: Trust model audit (weekly)

# D15-M13: governance/audit/domains/D15-trust-reference.md "Compliance
# Verification Schedule" declares a Weekly audit cadence for the full
# trust-model review. Before this workflow landed there was no scheduled
# CI runner — the cadence was prompt-only. This workflow runs `npm test`
# scoped to the pipeline/compliance suite plus the explicit compliance
# verification surface so the Weekly cadence has a machine-verifiable
# attestation in the repo's Actions history.
#
# Verified-scope split (D4-SA4.3-07): the trust-reference doc is private
# governance IP (gitignored; SSoT hatch3r-governance), absent on the PUBLIC
# runner — so the doc-currency assertions run only where the governance overlay
# is mounted (the doc is present at checkout). Every run of the doc-currency
# step writes its verified scope to the job summary ($GITHUB_STEP_SUMMARY), so
# the weekly green checkmark names exactly the evidence it holds (public:
# pipeline-compliance surface only; overlay: + doc currency) instead of the
# silent exit-0 skip implying the full review ran everywhere.
#
# Cron: every Monday 06:00 UTC (offset from the busiest publish window).
# Manual: `gh workflow run trust-model-audit.yml` triggers an ad-hoc run.
#
# D4-SA4.3-01 (Cycle 12): a second job, branch-protection-drift, rides the
# same weekly cron — it diffs the live `main` branch-protection payload
# against the documented contract; see its comment block for the contract.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  trust-model-compliance:
    name: D15 trust-reference compliance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      # Cycle 10 M D4-M2 (D4): env-scoped lifecycle-script deny — same rationale
      # documented in ci.yml. NPM_CONFIG_IGNORE_SCRIPTS sits at a higher npm 11
      # precedence band than .npmrc and is immune to transitive Git-dep
      # installconfig overrides.
      - name: Install dependencies (npm ci, lockfile-canonical)
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: npm ci

      # D15-M13: run the validate command's compliance verification end to
      # end. This exercises the ASI01 / ASI02 / ASI03 / ASI07 surfaces plus
      # the D15-M12 monotonic-privilege check and the D15-M6 fixer write-
      # scope assertion — i.e. the full Per-commit row of the Compliance
      # Verification Schedule, now on a Weekly cadence as well.
      - name: Compliance verification (pipeline)
        run: npx vitest run src/__tests__/pipeline/complianceVerification.test.ts src/__tests__/pipeline/agentToolAllowlist.test.ts src/__tests__/pipeline/agentIdentity.test.ts src/__tests__/pipeline/reviewLoop.test.ts

      # D15-30: crosswalk currency was unenforced — the only prior doc check
      # was the section-presence grep below, so Mediums D15-14/15/24 (stale
      # framework versions, a broken Implementation path `secretDetect.ts`, an
      # aged source date) sailed through green. This step adds three machine
      # assertions over governance/audit/domains/D15-trust-reference.md:
      #   1. every Implementation-column file path in the Control-to-Trust
      #      Mapping table resolves to an on-disk file (catches a renamed/
      #      deleted module before the doc rots);
      #   2. no `accessed <ISO>` source-provenance date is older than the
      #      120-day window (same backstop window as validate-pricing-currency
      #      / validate-references-currency);
      #   3. each framework version in expected-versions.json still matches
      #      the crosswalk, and no known-stale predecessor version regex does.
      # The version source-of-truth is expected-versions.json (committed
      # alongside this workflow): bump it when a cited framework re-versions
      # and the crosswalk is updated, and this gate fails until they agree.
      - name: Trust reference doc currency
        env:
          DOC: governance/audit/domains/D15-trust-reference.md
          VERSIONS: expected-versions.json
          WINDOW_DAYS: "120"
        run: |
          set -euo pipefail
          # governance/audit/domains/D15-trust-reference.md is private IP
          # (gitignored on the public repo; source of truth: hatch3r-governance),
          # so on the public runner the file is absent. Skip with a notice rather
          # than hard-fail — the same [ -f ] guard ci.yml uses for its
          # finding-registry step. Where the governance overlay is mounted the
          # file is present and the full currency check below runs.
          if [ ! -f "$DOC" ]; then
            echo "::notice::$DOC not present (private governance IP) — trust-reference doc-currency assertions skipped on this runner."
            # D4-SA4.3-07: the skip is correct by construction (private-IP split),
            # but a silent exit 0 lets the green check overclaim its scope. Write
            # the narrowed verified scope to the job summary so the attestation
            # names exactly the evidence this run holds (sign-off doctrine). Guard
            # $GITHUB_STEP_SUMMARY (set -u) so a missing sink never fails the skip.
            {
              echo "### Trust-reference doc currency — SKIPPED (scope-narrowed)"
              echo ""
              echo "\`$DOC\` is private governance IP (gitignored; SSoT hatch3r-governance) and is absent on this runner, so the D15-30 doc-currency assertions (implementation paths resolve, \`accessed\` dates within ${WINDOW_DAYS}d, framework versions current) did **not** run here."
              echo ""
              echo "**Verified scope of this run:** the pipeline-compliance surface only (ASI01 / ASI02 / ASI03 / ASI07 + the D15-M12 monotonic-privilege check + the D15-M6 fixer write-scope assertion, via the \`Compliance verification (pipeline)\` step). Doc currency is attested only where the governance overlay is mounted (the doc is present at checkout)."
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi
          if ! grep -q "## Compliance Verification Schedule" "$DOC"; then
            echo "::error::$DOC is missing the Compliance Verification Schedule section."
            exit 1
          fi
          cat > "$RUNNER_TEMP/trust-crosswalk-currency.cjs" <<'CURRENCY_CHECK'
          "use strict";
          // D15-30 trust-crosswalk currency assertions. Inputs via env:
          // DOC (trust-reference path), VERSIONS (expected-versions.json),
          // WINDOW_DAYS (accessed-date staleness window).
          const fs = require("fs");
          const path = require("path");
          const docPath = process.env.DOC;
          const versionsPath = process.env.VERSIONS;
          const WINDOW_DAYS = Number(process.env.WINDOW_DAYS || "120");
          const repoRoot = process.cwd();
          const errors = [];
          const fail = (m) => errors.push(m);

          let doc, versions;
          try {
            doc = fs.readFileSync(docPath, "utf8");
          } catch {
            fail(`cannot read trust-reference doc: ${docPath}`);
          }
          try {
            versions = JSON.parse(fs.readFileSync(versionsPath, "utf8"));
          } catch (e) {
            fail(`cannot read/parse version manifest ${versionsPath}: ${e.message}`);
          }
          if (errors.length) {
            for (const e of errors) console.error(`::error::${e}`);
            process.exit(1);
          }
          const lines = doc.split("\n");

          // Assertion 1: every Implementation-column file path exists. Scope is
          // strictly the Control-to-Trust Mapping table's 3rd pipe field, so
          // provenance citations elsewhere (absorbed-file names in the intro)
          // are not treated as live paths.
          function extractImplPaths() {
            const out = new Set();
            let inHeader = false, inBody = false;
            for (const raw of lines) {
              const line = raw.trim();
              if (/^\|\s*Control\s*\|\s*Trust Dimensions\s*\|\s*Implementation\b/.test(line)) {
                inHeader = true;
                continue;
              }
              if (inHeader && /^\|\s*-/.test(line)) {
                inHeader = false;
                inBody = true;
                continue;
              }
              if (inBody) {
                if (!line.startsWith("|")) break;
                const impl = (line.split("|")[3] || "").trim();
                for (const tok of impl.match(/[A-Za-z0-9_./-]+\.(?:ts|md)/g) || []) out.add(tok);
              }
            }
            return [...out];
          }
          function findByBasename(dir, base) {
            let entries;
            try {
              entries = fs.readdirSync(dir, { withFileTypes: true });
            } catch {
              return null;
            }
            for (const e of entries) {
              const full = path.join(dir, e.name);
              if (e.isDirectory()) {
                if (e.name === "node_modules" || e.name === "__tests__" || e.name === "dist") continue;
                const hit = findByBasename(full, base);
                if (hit) return hit;
              } else if (e.name === base) {
                return full;
              }
            }
            return null;
          }
          function resolvePath(token) {
            if (token.includes("/")) {
              return fs.existsSync(path.join(repoRoot, token)) ? token : null;
            }
            for (const r of ["src", "docs", "scripts", "governance"]) {
              const hit = findByBasename(path.join(repoRoot, r), token);
              if (hit) return path.relative(repoRoot, hit);
            }
            return null;
          }
          const implTokens = extractImplPaths();
          if (implTokens.length === 0) {
            fail("Implementation-column parse found 0 file tokens — table structure changed; assertion cannot run");
          }
          let implOk = 0;
          for (const tok of implTokens) {
            if (resolvePath(tok)) implOk++;
            else fail(`Implementation path does not resolve to an on-disk file: "${tok}" (Control-to-Trust Mapping table)`);
          }

          // Assertion 2: no `accessed <ISO>` date older than the window.
          const ACCESSED_RE = /accessed[:\s]+(\d{4})-(\d{2})-(\d{2})/g;
          const now = Date.now();
          const MS_PER_DAY = 86400000;
          let accessedCount = 0, m;
          while ((m = ACCESSED_RE.exec(doc)) !== null) {
            accessedCount++;
            const iso = `${m[1]}-${m[2]}-${m[3]}`;
            const ts = Date.parse(iso + "T00:00:00Z");
            if (Number.isNaN(ts)) {
              fail(`unparseable accessed date: "${iso}"`);
              continue;
            }
            const ageDays = Math.floor((now - ts) / MS_PER_DAY);
            if (ageDays > WINDOW_DAYS) {
              fail(`crosswalk source accessed date ${iso} is ${ageDays}d old (> ${WINDOW_DAYS}d window) — re-verify the source and refresh the date`);
            }
          }
          if (accessedCount === 0) {
            fail("no `accessed <date>` provenance found in doc — crosswalk currency is unverifiable");
          }

          // Assertion 3: each expected version regex matches, no stale predecessor does.
          const fw = (versions && versions.frameworks) || [];
          if (fw.length === 0) {
            fail(`${versionsPath} lists 0 frameworks — version assertion cannot run`);
          }
          for (const f of fw) {
            if (f.expectedRegex) {
              let er;
              try {
                er = new RegExp(f.expectedRegex);
              } catch (e) {
                fail(`bad expectedRegex for ${f.id}: ${e.message}`);
                continue;
              }
              if (!er.test(doc)) {
                fail(`expected current version /${f.expectedRegex}/ (${f.id}) not found in doc — crosswalk drifted behind ${versionsPath}`);
              }
            } else {
              fail(`framework ${f.id} has no expectedRegex in ${versionsPath}`);
            }
            if (f.staleRegex) {
              let re;
              try {
                re = new RegExp(f.staleRegex);
              } catch (e) {
                fail(`bad staleRegex for ${f.id}: ${e.message}`);
                continue;
              }
              if (re.test(doc)) {
                fail(`known-stale version for ${f.id} matched /${f.staleRegex}/ in doc — a predecessor version string is still cited; bump it to the current version`);
              }
            }
          }

          if (errors.length) {
            for (const e of errors) console.error(`::error::${e}`);
            console.error(`\nTrust-crosswalk currency: ${errors.length} failure(s).`);
            process.exit(1);
          }
          console.log(
            `Trust-crosswalk currency OK: ${implOk} implementation paths resolve, ` +
              `${accessedCount} accessed-date(s) within ${WINDOW_DAYS}d, ` +
              `${fw.length} framework version(s) current.`,
          );
          CURRENCY_CHECK
          node "$RUNNER_TEMP/trust-crosswalk-currency.cjs"
          # D4-SA4.3-07: doc present + assertions passed (set -e aborts the step
          # above on any node exit 1, so this only runs on success). Write the
          # affirmative doc-currency attestation to the job summary so the overlay
          # run's checkmark names the doc-currency evidence it holds.
          {
            echo "### Trust-reference doc currency — VERIFIED"
            echo ""
            echo "\`$DOC\` present at checkout (governance overlay mounted). The D15-30 doc-currency assertions passed: every Control-to-Trust Mapping implementation path resolves on disk, every \`accessed\` provenance date is within the ${WINDOW_DAYS}d window, and each framework version in \`$VERSIONS\` still matches the crosswalk (no known-stale predecessor version cited)."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

  # D4-SA4.3-01 (Cycle 12): branch-protection drift probe. Repo settings are
  # invisible to CI — the required-check list drifted from the ci.yml contract
  # for ~90 PRs (a phantom "Quality gates" context, dead since v1.1.0, made
  # compliance impossible and admin bypass the routine merge mechanism; PR #117
  # / v2.2.0 merged with the required "All CI checks" aggregator in FAILURE).
  # ci.yml documents the contract ("Branch-protection required-check list"
  # comment above the ci-success job); nothing verified live settings against
  # it. This job reads the classic branch-protection payload weekly and fails
  # on any drift from the contract below, so a settings regression surfaces in
  # Actions history instead of silently re-enabling bypass-as-norm.
  #
  # Contract (mirrors the ci.yml comment + the D4-SA4.3-01 resolution):
  #   - required contexts == exactly: "All CI checks",
  #     "Validate PR title (conventional commits)", "DCO sign-off check",
  #     "Bundle size gate" — never a rotating matrix leg like
  #     "build (22, ubuntu-latest)", never the removed "Quality gates"
  #   - strict up-to-date-branch: true
  #   - enforce_admins: true (bypass is exceptional, not the merge mechanism)
  #   - classic required_pull_request_reviews: absent — the review layer lives
  #     in ruleset 13329941, reconciled to 0 required approvals (solo-
  #     maintainer reality: self-approval never counts, so any count >= 1
  #     forces bypass on every merge)
  #
  # Token: GET /repos/{owner}/{repo}/branches/main/protection needs repository
  # Administration read access, which the workflow GITHUB_TOKEN cannot be
  # granted (administration is not a grantable workflow-token permission).
  # Provision a fine-grained PAT scoped to this repo with Repository
  # permissions -> Administration: Read-only, stored as the
  # BRANCH_PROTECTION_READ_TOKEN Actions secret. A missing secret fails this
  # job with instructions rather than skipping: an unreadable contract is an
  # unverified contract, and this probe exists to track exactly that class of
  # human-only settings follow-up.
  branch-protection-drift:
    name: Branch protection drift probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Diff live branch protection against the documented contract
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_READ_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::BRANCH_PROTECTION_READ_TOKEN secret is not set, so the probe cannot read branch protection (the workflow GITHUB_TOKEN cannot hold Administration:read). Create a fine-grained PAT scoped to $REPO with Repository permissions -> Administration: Read-only, then run: gh secret set BRANCH_PROTECTION_READ_TOKEN --repo $REPO"
            exit 1
          fi
          if ! live="$(gh api "repos/$REPO/branches/main/protection" 2>&1)"; then
            echo "::error::Cannot read branch protection for $REPO (token lacks Repository permissions -> Administration: Read-only?). gh api said: $live"
            exit 1
          fi
          expected_contexts='["All CI checks","Bundle size gate","DCO sign-off check","Validate PR title (conventional commits)"]'
          actual_contexts="$(jq -c '.required_status_checks.contexts | sort' <<<"$live")"
          actual_strict="$(jq -r '.required_status_checks.strict' <<<"$live")"
          actual_enforce="$(jq -r '.enforce_admins.enabled' <<<"$live")"
          classic_reviews_present="$(jq -r 'has("required_pull_request_reviews")' <<<"$live")"
          echo "live: contexts=$actual_contexts strict=$actual_strict enforce_admins=$actual_enforce classic_reviews_present=$classic_reviews_present"
          drift=0
          if [ "$actual_contexts" != "$expected_contexts" ]; then
            echo "::error::Required-check contexts drifted. Contract: $expected_contexts — live: $actual_contexts"
            drift=1
          fi
          if [ "$actual_strict" != "true" ]; then
            echo "::error::strict up-to-date-branch is '$actual_strict' — contract says true"
            drift=1
          fi
          if [ "$actual_enforce" != "true" ]; then
            echo "::error::enforce_admins is '$actual_enforce' — contract says true (bypass must be exceptional, not the merge mechanism)"
            drift=1
          fi
          if [ "$classic_reviews_present" != "false" ]; then
            echo "::error::classic required_pull_request_reviews is present — contract says absent (review policy lives in ruleset 13329941 at 0 required approvals)"
            drift=1
          fi
          if [ "$drift" -ne 0 ]; then
            echo "::error::Branch protection drifted from the documented contract (ci.yml 'Branch-protection required-check list' + D4-SA4.3-01). Re-apply the contract settings, then re-run this probe."
            exit 1
          fi
          echo "Branch protection matches the documented contract: contexts $expected_contexts, strict=true, enforce_admins=true, classic reviews absent."

  # D15-SA15.6-02 (Cycle 12): live-currency oracle. The "Trust reference doc
  # currency" step above is a closed doc<->manifest loop — both files are
  # maintainer-owned, so it verifies internal agreement, never agreement with
  # the live framework. It cannot observe that Anthropic shipped RSP v3.4 two
  # days after a doc touch while the crosswalk still cited v3.3. This job fetches
  # each cited framework's canonical page (expected-versions.json `probeUrl`) and
  # warns when the cited current version (`liveCurrentRegex`) is no longer what
  # the live page presents — i.e. the framework versioned past the citation.
  # Warning-only by construction: networks flake, and a transient fetch failure
  # must not red a scheduled hardening run; a real drift surfaces as a
  # ::warning:: in Actions history for a human to reconcile via
  # expected-versions.json. Reads only the committed manifest + public URLs, so
  # (unlike the doc-currency step) it is NOT a no-op on the public repo where the
  # private trust-reference doc is absent.
  framework-version-live-probe:
    name: Framework version live-currency probe (warning-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Fetch each cited framework's canonical page and diff the live version against the manifest
        env:
          VERSIONS: expected-versions.json
        run: |
          set -euo pipefail
          if [ ! -f "$VERSIONS" ]; then
            echo "::notice::$VERSIONS not present — nothing to probe."
            exit 0
          fi
          count="$(jq '.frameworks | length' "$VERSIONS")"
          echo "Probing $count framework entr(y/ies) from $VERSIONS (warning-only, live-source oracle)."
          warned=0
          for i in $(seq 0 "$((count - 1))"); do
            id="$(jq -r ".frameworks[$i].id" "$VERSIONS")"
            url="$(jq -r ".frameworks[$i].probeUrl // empty" "$VERSIONS")"
            live_re="$(jq -r ".frameworks[$i].liveCurrentRegex // empty" "$VERSIONS")"
            if [ -z "$url" ] || [ -z "$live_re" ]; then
              echo "::notice::$id: no probeUrl+liveCurrentRegex — live-currency probe skipped (annual/draft/unversioned framework, or not yet wired)."
              continue
            fi
            echo "probe $id -> $url  (expect live current form /$live_re/)"
            if ! body="$(curl -fsSL --max-time 25 --retry 2 --retry-delay 3 -A 'hatch3r-trust-model-audit/1.0' "$url" 2>/dev/null)"; then
              echo "::warning::$id: could not fetch $url (network/transient) — live-currency unverified this run; re-run the workflow or verify by hand."
              warned=$((warned + 1))
              continue
            fi
            if printf '%s' "$body" | grep -Eq "$live_re"; then
              echo "  ok: live page still presents the cited current version (/$live_re/ matched)."
            else
              echo "::warning::$id: live page $url no longer matches the cited current version /$live_re/ — the published framework may have versioned past expected-versions.json. Verify the live version, then bump the crosswalk cite in the trust-reference doc + this manifest (expectedRegex/staleRegex/liveCurrentRegex) together."
              warned=$((warned + 1))
            fi
          done
          echo "Live-currency probe complete: $warned warning(s). This job never fails the build (warning-only by design)."
