name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-commits:
    name: Validate PR title (conventional commits)
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN="^(feat|fix|chore|docs|refactor|test|ci|perf|build|style)(\([a-z0-9-]+\))?!?: .+"
          if ! echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "::error::PR title must follow conventional commits: $PR_TITLE"
            echo "Expected format: type(scope)?: description"
            echo "Valid types: feat, fix, chore, docs, refactor, test, ci, perf, build, style"
            exit 1
          fi
          echo "PR title is valid: $PR_TITLE"

  # Lint, typecheck, test, and audit are handled by ci.yml (which also triggers
  # on pull_request) across the full OS matrix. This workflow only contains
  # PR-specific checks: title validation (above) and bundle size (below).

  size-check:
    name: Bundle size report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Report dist size
        run: |
          echo "## Bundle size report"
          echo ""
          echo "dist/ contents:"
          du -sh dist/ 2>/dev/null || true
          find dist -type f -exec du -h {} \; 2>/dev/null | sort -rh || true
