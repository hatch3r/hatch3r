name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Cycle 10 H F4.3.2 (D4): step-security/harden-runner installed as the first
# step of every job — release.yml and deploy-docs.yml already carry it; this
# closes the defense-in-depth gap so PR-check jobs that run `npm ci` (size-check)
# or fetch git history (dco-check) get the same runtime egress/process
# monitoring as ci.yml. Audit mode builds a per-job traffic baseline without
# blocking; pinned to the v2.19.3 commit SHA used repo-wide. harden-runner ships
# behavioral guards only on Linux runners (all jobs here are ubuntu-latest).
jobs:
  lint-commits:
    name: Validate PR title (conventional commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN="^(feat|fix|chore|docs|refactor|test|ci|perf|build|style|audit)(\([a-z0-9-]+\))?!?: .+"
          if ! echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "::error::PR title must follow conventional commits: $PR_TITLE"
            echo "Expected format: type(scope)?: description"
            echo "Valid types: feat, fix, chore, docs, refactor, test, ci, perf, build, style, audit"
            exit 1
          fi
          echo "PR title is valid: $PR_TITLE"

  dco-check:
    name: DCO sign-off check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for DCO sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! COMMITS=$(git log --format="%H %s" "$BASE_SHA".."$HEAD_SHA"); then
            echo "::error::Could not list commits between base and head for DCO verification."
            exit 1
          fi
          if [ -z "$COMMITS" ]; then
            echo "No commits to check."
            exit 0
          fi
          MISSING=""
          while IFS= read -r line; do
            SHA=$(echo "$line" | cut -d' ' -f1)
            # Skip merge commits (e.g. GitHub "Update branch" button) — they
            # are auto-generated and cannot carry a Signed-off-by trailer.
            PARENT_COUNT=$(git cat-file -p "$SHA" | grep -c "^parent ")
            if [ "$PARENT_COUNT" -gt 1 ]; then
              continue
            fi
            BODY=$(git log -1 --format="%B" "$SHA")
            if ! echo "$BODY" | grep -qiE "^Signed-off-by: .+ <.+>"; then
              MISSING+=$'\n  '"$line"
            fi
          done <<< "$COMMITS"
          if [ -n "$MISSING" ]; then
            echo "::error::The following commits are missing DCO sign-off (Signed-off-by):$MISSING"
            echo "Consider using 'git commit -s' for future commits."
            exit 1
          fi

  # Lint, typecheck, test, and audit are handled by ci.yml (which also triggers
  # on pull_request) across the full OS matrix. This workflow only contains
  # PR-specific checks: title validation (above), DCO (above), and the bundle
  # size regression gate (below).

  size-check:
    name: Bundle size gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      # Cycle 10 M D4-M2 (D4): env-scoped lifecycle-script deny — .npmrc carries
      # the same flag, but a malicious transitive Git-dep can ship installconfig
      # keys that flip project-rc settings; the env var sits at a higher
      # precedence band (npm 11 config order: env > project rc).
      - name: Install dependencies
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: npm ci

      # Cycle 10 L F4.3.9 (D4): `time` captures the tsup build duration in the
      # ubuntu-only size-check log — the baseline for the build-output caching
      # decision (add actions/cache only if >60s; see ci.yml Build rationale).
      - name: Build
        run: time npm run build

      # Cycle 11 M D4-8 (D4): soft regression gate on the runtime CLI bundle.
      # The job was report-only (`du -sh dist/`), so the bundle drifted
      # 919 KB -> 1005 KB unnoticed. The gate compares dist/cli/index.js against
      # the committed baseline in .github/bundle-size-baseline.json and fails
      # only when the size exceeds baseline * (1 + tolerancePercent/100); the
      # +10% tolerance absorbs incidental dependency-bump churn while still
      # catching a real regression. It deliberately measures ONLY the compiled
      # CLI bundle — dist/content/ is a verbatim copy of the canonical corpus
      # whose growth is intentional, so it is excluded by construction (not
      # netted out). Regenerate the baseline after a justified bundle increase
      # per the note in .github/bundle-size-baseline.json. See
      # governance/audit/domains/D04-build-cicd.md SA 4.1 "Bundle size analysis".
      - name: Bundle size regression gate
        run: |
          node -e '
            const { statSync, readFileSync } = require("node:fs");
            const baseline = JSON.parse(readFileSync(".github/bundle-size-baseline.json", "utf8"));
            const artifact = baseline.artifact;
            const baseBytes = baseline.cliBundleBytes;
            const tolerance = baseline.tolerancePercent;
            const currentBytes = statSync(artifact).size;
            const limitBytes = Math.floor(baseBytes * (1 + tolerance / 100));
            const kib = (n) => (n / 1024).toFixed(1);
            const deltaPct = (((currentBytes - baseBytes) / baseBytes) * 100).toFixed(1);
            const summary = [
              "## Bundle size gate",
              "",
              "| Metric | Value |",
              "| --- | --- |",
              "| Artifact | `" + artifact + "` |",
              "| Baseline | " + kib(baseBytes) + " KiB (" + baseBytes + " bytes) |",
              "| Current | " + kib(currentBytes) + " KiB (" + currentBytes + " bytes) |",
              "| Delta | " + (deltaPct >= 0 ? "+" : "") + deltaPct + "% |",
              "| Limit (+" + tolerance + "%) | " + kib(limitBytes) + " KiB (" + limitBytes + " bytes) |",
              "",
            ].join("\n");
            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            if (summaryPath) require("node:fs").appendFileSync(summaryPath, summary + "\n");
            console.log(summary);
            if (currentBytes > limitBytes) {
              console.log("::error::" + artifact + " is " + kib(currentBytes) + " KiB, exceeding the +" + tolerance + "% budget of " + kib(limitBytes) + " KiB (baseline " + kib(baseBytes) + " KiB). Investigate the size increase, or — if intentional — regenerate .github/bundle-size-baseline.json per its note and commit it.");
              process.exit(1);
            }
            console.log(artifact + " within the +" + tolerance + "% budget.");
          '

      # Human-readable per-file breakdown for PR review context (no gate).
      - name: Report dist size
        if: always()
        run: |
          echo "### dist/ contents"
          echo ""
          du -sh dist/ 2>/dev/null || true
          find dist -type f -exec du -h {} \; 2>/dev/null | sort -rh || true
