name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Cycle 10 M D4-M2 (D4): every `npm ci` step in this file carries an inline
# `env: NPM_CONFIG_IGNORE_SCRIPTS: "true"` block. .npmrc declares the same flag,
# but a malicious transitive Git-dep can ship `installconfig` keys that flip
# project-rc settings mid-install. The env var sits at a higher precedence band
# (npm 11 config order: cli > env > project rc > user rc > global rc) and is
# not overridable by package-side configuration — hardening the Shai-Hulud /
# Axios-1.14.1 / crypto-js-4.2.1 class of supply-chain compromise.

# Cycle 9 C9-H9 (D4-H4.2.1): step-security/harden-runner installed as the
# first step of every job to monitor outbound network egress, file writes,
# and child-process spawns from inside the GitHub-hosted runner. Audit mode
# is the recommended starting policy per step-security/harden-runner
# README — it builds a per-job traffic baseline without blocking, so a
# malicious dependency exfil attempt (e.g. the Shai-Hulud / Axios 1.14.1
# class of post-install npm scripts) surfaces in the workflow log even
# when `npm audit` and the dependency-review-action miss it. Pinned to the
# v2.19.3 commit SHA (2026-05-14) per actions-pinning policy used for every
# third-party action in this file. Block mode is a future-cycle upgrade
# once the per-job allowlist is curated from the audit baseline.
#
# Branch-protection note: making this step a required PR check is the
# human-only follow-up (D4-H4.2.1 Mixed item) — settings → branches →
# require-status-check "Harden Runner" on main.
jobs:
  supply-chain:
    name: Supply chain security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: npm ci

      - name: Lockfile lint
        run: npm run lockfile:check

      # Cycle 10 H F4.2.1 (D4): package-lock.json drifted to 1.8.0 while
      # package.json declared 2.0.0 because the release version was
      # hand-bumped without regenerating the lockfile. A stale lockfile
      # version trips npm provenance, PackageGate signals, and
      # lockfile-aware analysers on publish. This gate fails the PR before
      # merge if the two `.version` fields diverge, so the drift can never
      # reach main (and therefore never reaches the publish step in
      # release.yml). jq is preinstalled on ubuntu-latest runners.
      - name: Lockfile version parity
        run: |
          pkg=$(jq -r '.version' package.json)
          lock_top=$(jq -r '.version' package-lock.json)
          lock_root=$(jq -r '.packages[""].version' package-lock.json)
          echo "package.json=$pkg lockfile.version=$lock_top lockfile.packages[\"\"].version=$lock_root"
          if [ "$pkg" != "$lock_top" ] || [ "$pkg" != "$lock_root" ]; then
            echo "::error::package-lock.json version ($lock_top / $lock_root) does not match package.json ($pkg). Run 'npm install --package-lock-only' and commit the regenerated lockfile."
            exit 1
          fi

      - name: Security audit (production)
        run: npm audit --audit-level=high --omit=dev

      - name: Security audit (all dependencies)
        run: npm audit --audit-level=critical

      # Cycle 8 C8-D4-M1: `npm audit` only flags packages that already
      # have a published advisory; it misses the malicious-install class
      # (typosquats, compromised maintainer accounts -- e.g. the
      # Shai-Hulud / Axios 1.14.1 incident, Mar 2026). The GitHub
      # Dependency Review Action inspects the PR diff of
      # `package-lock.json` against the base ref and queries the GitHub
      # Advisory Database live, catching newly-introduced compromised
      # versions. Gated to pull_request events because the action
      # requires a base ref to diff; for push events the npm audit
      # steps above remain the supply-chain gate.
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: critical
          comment-summary-in-pr: on-failure

      # Cycle 9 C9-H54 (D15-SA15.5-F05): packages launched by MCP servers
      # (npx -y @scope/pkg@<ver> entries in mcp/mcp.json) never enter
      # `package-lock.json`, so `npm audit` and the dependency-review-action
      # above cannot see them. Query OSV.dev (Google-maintained
      # open-source vulnerability DB, npm ecosystem from GHSA + npm
      # advisory feed) for each pinned (package, version) pair and fail
      # the gate if any Critical/High advisory has been public for more
      # than 30 days against a version we still ship. Network call to
      # api.osv.dev is required; transient failures surface as warnings
      # (queryErrors), not gate failures.
      - name: MCP package CVE check
        run: npm run mcp:cve-check

      # Cycle 10 H F15.7-H1 (D15-SA15.7): CLI tools selected during `init`
      # (ripgrep, fd, gh, jq, ... — declared in src/cliTools/registry.ts) are
      # installed by the end user from their package manager and never enter
      # package-lock.json, so neither `npm audit` nor the dependency-review
      # action above can see them. scripts/check-cli-cves.ts queries OSV.dev
      # (Google-maintained, multi-ecosystem: crates.io / Go / PyPI / npm) for
      # each pinned (tool, minVersion) pair and fails the gate if any
      # Critical/High advisory has been public longer than 30 days against a
      # version hatch3r still recommends. Mirrors the mcp:cve-check step above;
      # transient api.osv.dev failures surface as warnings (queryErrors), not
      # gate failures.
      - name: CLI-tool package CVE check
        run: npm run cli-tools:cve-check

      # Cycle 10 H F4.2.3 (D4): the five gates above (lockfile-lint, npm audit
      # x2, dependency-review-action, mcp:cve-check) are all reactive CVE/SHA
      # lookups — they flag a package only after a GHSA/OSV advisory exists.
      # That leaves the malicious-install class (typosquatting, dependency
      # confusion, compromised-maintainer payloads — Shai-Hulud, Axios 1.14.1,
      # crypto-js 4.2.1) detectable only hours-to-days late. Socket performs
      # install-time behavioral/AST analysis of newly-introduced dependencies
      # on the PR diff, catching exfil/obfuscation/install-script risk before
      # an advisory is published. Gated to pull_request (the action diffs
      # against the base ref) and guarded on SOCKET_API_KEY availability so it
      # is a clean no-op on fork PRs (where secrets are withheld) and until the
      # maintainer provisions the org secret — it never fails closed for
      # external contributors. Pinned to the v1.3.2 commit SHA (2026-03-27);
      # SocketDev/socket-security-action from the finding was superseded by
      # SocketDev/action. Vendor-decision record: D04 next cycle.
      - name: Socket supply-chain scan
        if: github.event_name == 'pull_request' && env.SOCKET_API_KEY != ''
        env:
          SOCKET_API_KEY: ${{ secrets.SOCKET_API_KEY }}
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          socket-token: ${{ secrets.SOCKET_API_KEY }}

      # Cycle 11 H D4-3 (D4): resolve every SHA-pinned `uses:` back to its tag
      # via `git ls-remote` and fail if the trailing `# <version>` comment names
      # a version the SHA does not resolve to. Catches the dependabot-advances-
      # -digest-across-majors-without-rewriting-the-comment drift (checkout v4
      # comment on a v6.0.2 SHA) that no prior gate saw. A `git ls-remote`
      # transport failure surfaces as a warning, not a gate failure (network
      # policy mirrors mcp:cve-check / cli-tools:cve-check above), so a transient
      # github.com outage cannot red an unrelated PR.
      - name: Action pin comment vs SHA
        run: npm run validate:action-pins

  build:
    runs-on: ${{ matrix.os }}
    # Windows runners are I/O-slow and variable: the full suite (npm ci + build
    # + ~4500 tests, no coverage) finishes in ~10 min on a fast windows-latest
    # box, but slow-runner variance pushed node 22/24 past a flat 15-min ceiling
    # (cancelled at 15m04s/15m11s) while node 26 finished in 9m43s on the SAME
    # commit with every test passing. Give Windows headroom; keep the tight
    # 15-min hang-guard for the fast OSes.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 25 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        # Cycle 10 M D4-M3 (D4): Node 22 is the minimum supported version
        # (engines >= 22.0.0). Node 24 is the current LTS lane; Node 26 is the
        # April-2026 odd-numbered release exercising the upcoming runtime
        # behaviors (V8 13.4, undici 7.x deprecations) so a regression there
        # surfaces in CI before the version becomes LTS in October 2026. The
        # `engines: >=22.0.0` declaration permits Node 26 today, so leaving the
        # lane untested left users on the bleeding edge unprotected.
        node-version: [22, 24, 26]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # Cycle 9 C9-H9 (D4-H4.2.1): see top-of-file rationale block.
      # harden-runner only ships behavioral guards for Linux runners, so on
      # macos/windows the action no-ops cleanly — installing it
      # unconditionally is simpler than a matrix exclusion and preserves
      # the "first step of every job" invariant from the supply-chain job.
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate --omit=dev

      # Cycle 10 L F4.3.9 (D4): build-output caching is gated on a measurement
      # — GitHub Actions records this step's wall-clock duration per matrix
      # entry in the run log, which is the baseline the cache decision needs.
      # If `npm run build` exceeds 60s per matrix entry, add actions/cache@<sha>
      # keyed on package-lock.json + tsup sources for dist/; below 60s the
      # esbuild/tsup build is fast enough that cache-invalidation overhead would
      # cost more than it saves, so leave as-is. Re-evaluate each cycle.
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Cycle 10 L D3-SA3.1-F3.1.10 (D3): `--no-update` makes vitest fail (not
      # silently rewrite) on any snapshot mismatch, so a developer-side
      # `vitest -u` that updated `__snapshots__/*.snap` without review cannot
      # pass CI. `vitest run` already fails on mismatch by default; the explicit
      # flag removes the ambiguity and is the byte-validation gate for the
      # committed snapshot artifact.
      # Cycle 11 H D3-4 (D3): assert the coverage step's exit code AND that
      # coverage was actually produced. `run:` already fails the job on a
      # non-zero exit, but the vitest v8 provider had a `forks`-pool race
      # (#5903/#4943/#5521) that could leave collection broken; pinning
      # `reportsDirectory` to an absolute path + `coverage.clean: false` in
      # vitest.config.ts fixes the race at root cause. This guard is the CI
      # tripwire: it fails loudly if `coverage/coverage-summary.json` (the
      # json-summary reporter output) is absent — a silent collection failure
      # can no longer pass green.
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: |
          npx vitest run --coverage --no-update
          test -f coverage/coverage-summary.json \
            || { echo "::error::coverage run produced no coverage/coverage-summary.json (collection failed)"; exit 1; }

      - name: Test without coverage
        if: matrix.os != 'ubuntu-latest' || matrix.node-version != 22
        run: npm run test:ci

      # Cycle 7 H10: filesystem-derived inventory must match committed copy.
      # Drift means CLAUDE.md / README.md counts can no longer be trusted.
      - name: Inventory drift check
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: |
          npm run inventory
          git diff --exit-code governance/inventory.json

      # Cycle 8 C8-D19-M1 / C8-D10-M1: counts claimed in README.md, CLAUDE.md,
      # and .cursor-plugin/plugin.json must match the regenerated inventory.
      # Stops the CLAUDE.md "26 rules" / stale-pipeline-count class of drift
      # (historical rule-count drift and pipeline-count drift) from reaching
      # main.
      - name: Inventory doc-drift check
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: npm run inventory:check-docs

      # Cycle 11 D16-1 (Critical, CI enforcement keystone): package.json
      # `validate` chains 10 content/governance gates (rule-parity, efficiency,
      # cli-skills, wiring, control-reachability, anti-slop, specialist-roster,
      # severity-vocabulary, canonical, adapter-parity), but only 3 of them
      # (rule-parity, wiring, specialist-roster) previously ran in this workflow —
      # the rest ran in no CI step, so content and governance enforcement was
      # honor-system on PRs. This single umbrella step runs the full `npm run
      # validate` chain and supersedes the former standalone validator steps (no
      # double-running). control-reachability (Cycle 11 D16-3) parses each
      # control-status doc's Enforcement column and fails CI when a module
      # labelled runtime-CLI is not reachable from the CLI entry point — the
      # doc-honesty gate for the "documented-but-unwired control" pattern. Each
      # gate runs via `tsx` against source, so no built dist/ is required; the
      # step is gated to the canonical Linux/Node-22 matrix entry like the other
      # single-run content gates. Branch-protection note: making this a required
      # PR status check on main is the human-only follow-up (settings -> branches
      # -> require-status-check on the build job for the canonical matrix entry).
      - name: Content + governance validation gates
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: npm run validate

      # Cycle 11 H D13-9 (D13-SA13.5-F2): the `npm run validate` umbrella above
      # runs the scripts/validate-*.ts chain (including validate:efficiency ->
      # validate-fanout-emission.ts, the P8 B2 fan-out gate), but it does NOT
      # invoke the `hatch3r validate` CLI command. The P8 B1 §0 ambiguity-gate
      # floor lives only in that command (src/cli/commands/validate.ts
      # requiresAmbiguityGate/checkAmbiguityGate): a published agent/command/skill
      # that drops its §0 gate is a hard error there but was invisible at merge,
      # so the B1 100%-coverage invariant was honor-system on PRs. This step runs
      # the CLI (default mode: missing-gate = error, exit 64; anti-slop + pillar
      # findings stay warnings, so the 379-warning canonical baseline does not red
      # the gate) via tsx against source — no built dist/ needed, matching the
      # content-gate pattern above. program.ts validate help text already states
      # "CI should run BOTH `hatch3r validate` AND `npm run validate`"; this closes
      # that gap. Escalating the §0-present-no-protocol warning to error is a
      # follow-up validate.ts change, deferred so the current warning does not
      # block this gate. Gated to the canonical Linux/Node-22 matrix entry.
      - name: Canonical content B1 gate (hatch3r validate)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: npx tsx src/cli/index.ts validate

      # Audit-state hygiene: finding-registry shape + invariants 1-7 from
      # AUDIT-EXECUTE.md §Finding Registry. Blocking once Phase 3 archival
      # tooling lands (plan-implementing-a-sofficticated-ancient-penguin.md).
      - name: Finding registry drift check
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: |
          if [ -f governance/audit/finding-registry.json ]; then
            npm run audit:validate-registry
          else
            echo "finding-registry absent — skipping"
          fi
