name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: Supply chain security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lockfile lint
        run: npm run lockfile:check

      - name: Security audit (production)
        run: npm audit --audit-level=high --omit=dev

      - name: Security audit (all dependencies)
        run: npm audit --audit-level=critical

  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Node 22 is the minimum supported version (engines >= 22.0.0)
        node-version: [22, 24]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate --omit=dev

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: npx vitest run --coverage

      - name: Test without coverage
        if: matrix.os != 'ubuntu-latest' || matrix.node-version != 22
        run: npm test

      # Cycle 7 H10: filesystem-derived inventory must match committed copy.
      # Drift means CLAUDE.md / README.md counts can no longer be trusted.
      - name: Inventory drift check
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: |
          npm run inventory
          git diff --exit-code governance/inventory.json

      # Cycle 7 H12: every `rules/hatch3r-*.md` must have a `.mdc` Cursor
      # counterpart whose body content matches (frontmatter format may differ).
      # Per .claude/rules/content-authoring.md the two variants are the
      # single-source-of-truth pairing for editor and CLI consumers.
      - name: Rule parity drift check
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: npm run validate:rule-parity
