version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      production:
        dependency-type: "production"
      development:
        dependency-type: "development"
    # Cycle 12 L D4-SA4.2-05 (D4) resolution, 2026-07-13: TypeScript 7.0 went GA
    # 2026-07-08; the weekly dev-group PR carried typescript 6.0.2 -> 7.0.2 and
    # failed `npm ci` with ERESOLVE on every CI leg — typescript-eslint@8.63.0
    # peer-rejects typescript 7.x, so adoption is mechanically blocked before
    # the planned `tsc --noEmit` + @types assessment can even run. Decision:
    # DEFER via the ignore rule below (majors only; 6.x minors/patches still
    # flow). Revisit trigger: typescript-eslint publishes a release whose peer
    # range admits typescript 7.x — then delete this ignore rule and run the
    # assessment recorded in the D4-SA4.2-05 finding before merging the bump.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  # Cycle 12 H D4-SA4.2-02 (D4): the website/ Docusaurus site ships its own
  # package.json + package-lock.json (committed 2026-03-02) that the root "/"
  # npm entry above does not cover — dependabot `directory` scoping is exact,
  # not recursive. Without this second entry website/ got no update PRs, so a
  # critical shell-quote advisory (CVE-2026-9277) sat open 30 days unremediated.
  # Grouped weekly, mirroring the root split.
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    groups:
      production:
        dependency-type: "production"
      development:
        dependency-type: "development"
  # Cycle 11 H D4-3 (D4): GitHub Actions are SHA-pinned with a trailing
  # `# <version>` comment. dependabot rewrites the digest on a bump but mirrors
  # the existing comment granularity verbatim — a coarse `# v4` comment that was
  # bumped across majors (v4 -> v6.0.2) stays `# v4`, lying about the pinned
  # code. dependabot exposes no config key to force a precise-semver comment,
  # so the enforcement backstop is the `validate:action-pins` CI gate
  # (.github/workflows/ci.yml, supply-chain job): it resolves each pinned SHA
  # to its tag and fails on a comment that names a version the SHA does not
  # resolve to. When merging a dependabot Actions PR, confirm that gate is green
  # and rewrite any coarse `# vN` comment to the precise `# vX.Y.Z` it bumped to.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
